<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620">
  <defs>
    <filter id="paperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#18181b" />

  <!-- Paper Container -->
  <g transform="translate(30, 25)" filter="url(#paperShadow)">
    <!-- Paper Sheet -->
    <rect x="0" y="0" width="420" height="570" rx="8" fill="#fbfbfa" stroke="#e4e4e7" stroke-width="1.5" />
    
    <!-- Top Receipt Zig-Zag / Header Accent -->
    <rect x="0" y="0" width="420" height="6" fill="#0075de" rx="3" />

    <!-- Shop Brand & Details -->
    <text x="210" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">POOJA COSMETICS &amp; GENERAL</text>
    <text x="210" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Retail Counter Slip / बिक्री पर्ची</text>
    <text x="210" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Station Road, Ward No. 4 • Phone: +91 98260 XXXXX</text>

    <!-- Meta Details Box -->
    <rect x="20" y="102" width="380" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="32" y="124" font-family="monospace" font-size="11" font-weight="600" fill="#334155">SLIP: #KS-2026-104</text>
    <text x="260" y="124" font-family="monospace" font-size="11" font-weight="600" fill="#334155">DATE: 29-OCT-2026</text>

    <!-- Table Header -->
    <line x1="20" y1="154" x2="400" y2="154" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="24" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569"># ITEM NAME</text>
    <text x="260" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">QTY</text>
    <text x="320" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="end">RATE</text>
    <text x="396" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="end">AMOUNT</text>
    <line x1="20" y1="180" x2="400" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Line 1: Kaveri Mehendi Cone -->
    <g transform="translate(0, 204)">
      <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">1. Kaveri Mehendi Cone 25g</text>
      <text x="260" y="0" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">5</text>
      <text x="320" y="0" font-family="monospace" font-size="12" fill="#475569" text-anchor="end">₹15</text>
      <text x="396" y="0" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">₹75.00</text>
    </g>

    <!-- Line 2: Maybelline Colossal Kajal -->
    <g transform="translate(0, 240)">
      <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">2. Maybelline Colossal Kajal</text>
      <text x="260" y="0" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">1</text>
      <text x="320" y="0" font-family="monospace" font-size="12" fill="#475569" text-anchor="end">₹199</text>
      <text x="396" y="0" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">₹199.00</text>
    </g>

    <!-- Line 3: Shilpa Velvet Round Red Bindi -->
    <g transform="translate(0, 276)">
      <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">3. Shilpa Red Bindi Size 6</text>
      <text x="260" y="0" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">2</text>
      <text x="320" y="0" font-family="monospace" font-size="12" fill="#475569" text-anchor="end">₹20</text>
      <text x="396" y="0" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">₹40.00</text>
    </g>

    <!-- Line 4: Nivea Cream -->
    <g transform="translate(0, 312)">
      <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">4. Nivea Cream Moisturiser</text>
      <text x="260" y="0" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">1</text>
      <text x="320" y="0" font-family="monospace" font-size="12" fill="#475569" text-anchor="end">₹160</text>
      <text x="396" y="0" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">₹160.00</text>
    </g>

    <!-- Line 5: Boroline Cream -->
    <g transform="translate(0, 348)">
      <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">5. Boroline Ayurvedic Cream 20g</text>
      <text x="260" y="0" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">2</text>
      <text x="320" y="0" font-family="monospace" font-size="12" fill="#475569" text-anchor="end">₹45</text>
      <text x="396" y="0" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">₹90.00</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="380" x2="400" y2="380" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Subtotals / Calculations -->
    <g transform="translate(0, 404)">
      <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Total Items: 5 (11 units)</text>
      <text x="280" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Sub Total:</text>
      <text x="396" y="0" font-family="monospace" font-size="11" font-weight="600" fill="#334155" text-anchor="end">₹564.00</text>
    </g>

    <!-- Grand Total Box -->
    <rect x="20" y="422" width="380" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="36" y="448" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#0f172a">GRAND TOTAL</text>
    <text x="388" y="449" font-family="monospace" font-size="16" font-weight="800" fill="#0075de" text-anchor="end">₹564.00</text>

    <!-- Payment Badge -->
    <rect x="20" y="476" width="90" height="20" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="65" y="490" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">PAID IN CASH</text>
    <text x="396" y="490" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">Counter Sales Terminal #1</text>

    <!-- Footer Note -->
    <line x1="20" y1="512" x2="400" y2="512" stroke="#e2e8f0" stroke-width="1" />
    <text x="210" y="534" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Thank you for shopping! Visit Again</text>
    <text x="210" y="550" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Koro AI Smart Scanner Verified</text>
  </g>
</svg>
